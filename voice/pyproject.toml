[project]
name = "english-coach-voice"
version = "0.1.0"
description = "english-coach voice gateway: ASR / phoneme-level pronunciation assessment / TTS / LLM feedback / dialogue"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "numpy>=1.26",
    "av>=12.0",
    "praat-parselmouth>=0.4.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 云 provider（惰性导入：不安装也能跑 PROVIDER_MODE=mock）
azure = ["azure-cognitiveservices-speech>=1.36"]
# 本地兜底 provider（惰性导入，首次调用才加载模型）
local = ["faster-whisper>=1.0", "edge-tts>=6.1"]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
