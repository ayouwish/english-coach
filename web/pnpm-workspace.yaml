# pnpm 的配置放在这里（package.json 里的 "pnpm" 字段已不再被读取）。
#
# ⚠️ 三个坑，都是踩过才写在这里的：
#
# 1) 不要写机器专属路径。早期这里写过 `storeDir: ../../.cache/pnpm-store`
#    （指向仓库外），在 CI 和别人的机器上完全无效，甚至可能因目录不可写而失败。
#    → 已移除，改用 pnpm 默认 store。
#
# 2) 配置键名在 pnpm 11 变过：
#    · pnpm 10 用 `onlyBuiltDependencies:`（**数组**）
#    · pnpm 11 用 `allowBuilds:`（**映射**，值是 boolean，数组会被拒绝）
#    本项目锁定 pnpm 11（见 package.json 的 `packageManager`），所以用 allowBuilds。
#    写成旧格式不会报"配置错误"，而是**静默失效** → 构建脚本全被忽略 →
#    安装结束时抛 `ERR_PNPM_IGNORED_BUILDS`（正是首次 CI 失败的原因）。
#
# 3) 也不要随手加 `packages:` 字段。本仓库是单包（非 monorepo），
#    声明 workspace 会改变依赖提升与链接语义；纯配置型的文件 pnpm 11 可以正常读取。
#
# 这些依赖的 postinstall 必须执行（原生模块编译 / 二进制下载）。
# 不声明的话：better-sqlite3 不会被编译、esbuild 没有二进制 —— 装得"成功"但跑不起来。
allowBuilds:
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
