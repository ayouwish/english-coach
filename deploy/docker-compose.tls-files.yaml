# 用「现成证书文件」跑 Caddy 的覆盖文件
#
# 场景：80/443 被 NAS 自带 Nginx 占用（飞牛/群晖/威联通），
#       且你已经有 PEM 证书（acme.sh / 商业证书 / 自签）。
#
# 用法（在 deploy/ 目录）：
#   mkdir -p certs
#   cp /path/fullchain.pem certs/ && cp /path/privkey.pem certs/ && chmod 600 certs/privkey.pem
#   # .env 里设 SITE_ADDRESS=<证书里的域名> 与 COOKIE_SECURE=1
#   docker compose -f docker-compose.yml -f docker-compose.tls-files.yaml up -d voice web caddy
#
# 访问： https://<证书里的域名>:8443
#
# ── 为什么这里要用 !override ──────────────────────────────────────────────────
# Compose 对 `ports` / `volumes` 这类多值字段默认是**追加**合并：
#   · ports 直接写 8443:443 会把 base 的 80/443 保留 → 照样和系统 Nginx 冲突
#   · volumes 追加会变成"同一个 /etc/caddy/Caddyfile 挂两次" → 容器起不来
# 所以两处都用 !override 整段替换（需要 Compose ≥ v2.24）。

services:
  caddy:
    ports: !override
      - "8443:443"
      - "8443:443/udp"
    volumes: !override
      # 用「现成证书」版本的配置（tls /certs/fullchain.pem /certs/privkey.pem）
      - type: bind
        source: ./Caddyfile.tls-files
        target: /etc/caddy/Caddyfile
        read_only: true
      # 证书目录（只读挂入）
      - type: bind
        source: ./certs
        target: /certs
        read_only: true
      # CA / 证书缓存（ACME 模式才用得到，这里保留以免切换时丢数据）
      - type: volume
        source: caddy-data
        target: /data
      - type: volume
        source: caddy-config
        target: /config
