# english-coach · 家庭英语口语教练 —— 单机编排（web + voice + Caddy TLS）
#
# 用法（全部命令都在本目录 deploy/ 下执行）：
#   cp .env.example .env          # 第一次必须做：填写 provider 开关与密钥
#   docker compose config         # 只校验语法，不启动
#   docker compose up -d --build  # 构建并启动
#   docker compose ps             # 看 healthcheck 状态
#
# 三个容器：
#   caddy  —— 唯一对外入口，负责 HTTPS（getUserMedia 只在安全上下文可用，见 docs/deployment.md）
#   web    —— Next.js 业务/账号/SQLite，容器内 :3000，只暴露给 caddy 与本机调试
#   voice  —— FastAPI AI 网关，容器内 :8100，唯一持有云 API 密钥的地方
#
# 数据落盘：host 的 ../data 同时挂给 web 和 voice（同一个目录 = 备份就是打包一个目录）
# 模型缓存：命名卷 voice-models 挂到 /models（首次启动会下载模型，见 docs/deployment.md）

name: english-coach

services:
  # ────────────────────────────────────────────────────────────────────────────
  # voice：AI Gateway（ASR / 发音评测 / TTS / LLM 反馈 / 对话）
  # ────────────────────────────────────────────────────────────────────────────
  voice:
    build:
      context: ../voice
      dockerfile: Dockerfile
      args:
        # Python 包源：国内/离线环境在 .env 里设
        #   PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: english-coach-voice:0.1.0
    restart: unless-stopped
    # .env 不存在时不报错（compose 长语法 required:false）；仍建议先 cp .env.example .env
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      MODEL_CACHE_DIR: /models
      VOICE_HOST: 0.0.0.0
      VOICE_PORT: "8100"
    volumes:
      - type: bind
        source: ../data
        target: /data
      - type: volume
        source: voice-models
        target: /models
    # 只绑本机回环：公网/局域网一律走 caddy，避免绕过 TLS
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      # 契约 §1：GET /v1/health，无鉴权。用 python 自检，镜像里不需要 curl/wget
      test:
        - CMD
        - python
        - -c
        - |
          import json,sys,urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8100/v1/health", timeout=3) as r:
                  body=json.load(r)
              sys.exit(0 if r.status==200 and body.get("status")=="ok" else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s   # 首次启动可能要下载 ASR 模型，给足冷启动时间
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          # 无 GPU 的 CPU 推理：留出余量给 web 与系统。显存/内存不足的排查见 docs/deployment.md
          memory: 8g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [appnet]

  # ────────────────────────────────────────────────────────────────────────────
  # web：Next.js（standalone）—— 账号、会话、SQLite、音频、SRS、家长面板
  # ────────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        # ★ 构建期注入：Next.js 的 rewrites() 在 `next build` 时求值，destination 会被
        # 烘焙进 .next/routes-manifest.json，运行时不再读环境变量。
        # 不在这里传的话，构建期 fallback 成 http://127.0.0.1:8100 → web 容器内指向自己，
        # 浏览器播放 /voice/v1/audio/... 会全部 404/502。
        VOICE_SERVICE_URL: http://voice:8100
        # npm registry：国内/离线环境在 .env 里设 NPM_REGISTRY=https://registry.npmmirror.com
        # （默认官方源）。不设也能构建，只是飞牛/国内直连 npmjs 可能超时。
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: english-coach-web:0.1.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      # 服务端调用 voice（compose 服务名解析）；浏览器不直接访问 voice
      VOICE_SERVICE_URL: http://voice:8100
      # 由 caddy 终止 TLS，web 只信来自本机反代的头
      TRUST_PROXY: "1"
    volumes:
      - type: bind
        source: ../data
        target: /data
    ports:
      - "127.0.0.1:3000:3000"   # 仅本机调试用；局域网/公网访问请走 https://<SITE_ADDRESS>
    depends_on:
      voice:
        condition: service_started
    healthcheck:
      # web-dev 提供的探活路径：GET /api/health 恒返回 200（voice 不可达也在 body 里标记）
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:3000/api/health")
            .then(r => process.exit(r.ok ? 0 : 1))
            .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [appnet]

  # ────────────────────────────────────────────────────────────────────────────
  # caddy：TLS 终止 + 反向代理（唯一对外入口）
  # 为什么必须 HTTPS：浏览器 getUserMedia（录音）只在 secure context 可用，
  # localhost 是唯一例外。局域网/公网访问必须 TLS，否则麦克风直接不可用。
  # ────────────────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # ★ 宿主端口走环境变量：NAS 上 80/443 常被系统 Nginx 占用（飞牛/群晖/威联通），
    #   在 .env 里设 CADDY_HTTP_PORT / CADDY_HTTPS_PORT 即可改端口，**不需要覆盖文件**。
    #   早期版本用 `ports: !override` 的另一个 compose 文件来做，但那个 tag 需要
    #   Compose ≥ v2.24，而且"忘了带第二个 -f"时会静默沿用 80/443 → 报
    #   `failed to bind host port for 0.0.0.0:80: address already in use`。改用变量后没有这个陷阱。
    #   例：CADDY_HTTP_PORT=8080  CADDY_HTTPS_PORT=8443  → 访问 https://<host>:8443
    ports:
      # 默认**只发布 HTTPS**：NAS 上 80/8080 常被系统服务占用（飞牛自带 Nginx 就占 80/443/8000/8001），
      # 而 NAS 场景用的 `Caddyfile.tls-files` 里也没有 :80 跳转块 —— 发布它只是白白制造端口冲突。
      # 只有这两种情况才需要放开 HTTP：
      #   ① 公网域名 + Caddy 自动 ACME（HTTP-01 验证必须 80）
      #   ② 想要 http→https 自动跳转（Caddyfile 默认变体里有 :80 块）
      # 需要时把下面这行取消注释，并设 CADDY_HTTP_PORT：
      # - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"   # HTTP/3
    volumes:
      # Caddyfile 路径同样可切：默认用自签/ACME 版；已有 PEM 证书时设
      #   CADDYFILE=Caddyfile.tls-files
      - type: bind
        source: ./${CADDYFILE:-Caddyfile}
        target: /etc/caddy/Caddyfile
        read_only: true
      # 证书目录（只有 CADDYFILE=Caddyfile.tls-files 时才被读取）。
      # 总是挂载：空目录不会影响 internal/ACME 模式，省掉一个覆盖文件。
      - type: bind
        source: ./certs
        target: /certs
        read_only: true
      - type: volume
        source: caddy-data
        target: /data      # 证书与 internal CA 私钥都在这里（root.crt 从这里导出）
      - type: volume
        source: caddy-config
        target: /config
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [appnet]

  # ────────────────────────────────────────────────────────────────────────────
  # ollama（可选）：全本地 LLM 兜底，只在显式启用时启动
  #   docker compose --profile local-llm up -d
  # 然后把 .env 里 LLM_BASE_URL 指到 http://ollama:11434/v1
  # CPU-only 机器上 7B 模型约 30-60s/轮，仅作为断网兜底，不要作为主力。
  # ────────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    profiles: [local-llm]
    restart: unless-stopped
    volumes:
      - type: volume
        source: ollama-models
        target: /root/.ollama
    expose: ["11434"]
    deploy:
      resources:
        limits:
          memory: 6g
    networks: [appnet]

volumes:
  voice-models:
  caddy-data:
  caddy-config:
  ollama-models:

networks:
  appnet:
    driver: bridge
